<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overtake</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{--page:#e3e8df;--ink:#fff;--hud:rgba(18,20,24,.62);--accent:#e2231a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#14171a}}
:root[data-theme="dark"]{--page:#14171a}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--page);display:grid;place-items:center;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;color:var(--ink);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage{position:relative;aspect-ratio:7/12;width:min(calc(100vw - 24px),calc((100dvh - 24px) * 7 / 12));border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.28)}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;background:var(--hud);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px;padding:10px 14px;pointer-events:none}
.top{top:14px;left:14px;right:14px;display:flex;align-items:center;gap:14px}
.hp{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.hp i{display:block;height:100%;width:100%;border-radius:99px;background:hsl(120 60% 52%);transition:width .18s ease}
.score{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;min-width:64px;text-align:right;line-height:1}
.speed{left:14px;bottom:14px;min-width:132px}
.speed b{font-size:42px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.speed span{font-size:15px;opacity:.7;margin-left:5px}
.sbar{height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin-top:7px;overflow:hidden}
.sbar i{display:block;height:100%;width:0;background:#fff;border-radius:99px}
.sbar i.boost{background:var(--accent)}
.hpn{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;min-width:34px;line-height:1}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(18,20,24,.58);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);text-align:center;padding:24px}
.overlay.hide{display:none}
h1{margin:0;font-size:clamp(44px,12vw,64px);font-weight:700;letter-spacing:.01em;line-height:1}
#msg{margin:0;font-size:22px;opacity:.85}
button{font:inherit;font-size:22px;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:99px;padding:10px 30px;margin-top:6px;cursor:pointer;transition:transform .12s ease,filter .12s ease}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
small{font-size:16px;opacity:.65;max-width:260px;line-height:1.3}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="hud top"><div class="hpn" id="hpn">100</div><div class="hp"><i id="hpf"></i></div><div class="score" id="sc">0</div></div>
  <div class="hud speed"><div><b id="sp">0</b><span>km/h</span></div><div class="sbar"><i id="sbf"></i></div></div>
  <div class="overlay" id="ov">
    <h1 id="ttl">Overtake</h1>
    <p id="msg">Dodge the traffic. Pass cars for bonus points.</p>
    <button id="go">Start race</button>
    <small>Arrow keys or WASD to drive. Hold Space to boost. On touch, hold the left or right side to steer.</small>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=420,H=720,RL=50,RR=370,LANES=4,LW=(RR-RL)/LANES,PY=H-150;
const LANE_SPEED=[120,95,75,60],COLORS=['#e8e6df','#3b6ea3','#d9a43b','#3f8f86','#8d96a3'];
const $=id=>document.getElementById(id);
const hpf=$('hpf'),sc=$('sc'),sp=$('sp'),sbf=$('sbf'),ov=$('ov'),hpn=$('hpn');
const K=2,MAX=360,MAXB=440;
function fit(){const s=(window.devicePixelRatio||1)*cv.clientWidth/W;cv.width=Math.round(W*s);cv.height=Math.round(H*s);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0)}
addEventListener('resize',fit);fit();

let mode='ready',speed=120,off=0,px=W/2,pvx=0,health=100,dist=0,bonus=0,objs=[],pops=[],invuln=0,shake=0,acc=0,gap=300,last=0,time=0,openLane=-1;
const keys={left:0,right:0,up:0,down:0,boost:0},touch={on:false,dir:0};

function reset(){speed=120;off=0;px=W/2;pvx=0;health=100;dist=0;bonus=0;objs=[];pops=[];invuln=0;shake=0;acc=0;gap=260;time=0;openLane=-1}
function start(){reset();mode='play';ov.classList.add('hide')}
function end(){mode='over';$('ttl').textContent='Crashed';$('msg').textContent='Score '+score().toLocaleString();$('go').textContent='Race again';ov.classList.remove('hide')}
const score=()=>bonus+Math.floor(dist/10);
$('go').addEventListener('click',()=>{if(mode!=='play')start()});

const map={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'};
addEventListener('keydown',e=>{
  if(map[e.key]){keys[map[e.key]]=1;e.preventDefault()}
  else if(e.key===' '){e.preventDefault();if(e.repeat)return;if(mode==='play')keys.boost=1;else start()}
  else if(e.key==='Enter'&&mode!=='play'){e.preventDefault();start()}
});
addEventListener('keyup',e=>{if(map[e.key])keys[map[e.key]]=0;if(e.key===' ')keys.boost=0});
addEventListener('blur',()=>{keys.left=keys.right=keys.up=keys.down=keys.boost=0});
function tdir(e){const r=cv.getBoundingClientRect();touch.dir=(e.clientX-r.left)<r.width/2?-1:1}
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){touch.on=true;tdir(e)}});
cv.addEventListener('pointermove',e=>{if(touch.dir&&e.pointerType==='touch')tdir(e)});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>{touch.dir=0}));

function spawn(){
  const p=Math.min(1,time/120);
  let n=1;
  if(Math.random()<.12+.5*p)n=2;
  if(p>.4&&Math.random()<.35*p)n=3;
  let lanes=[0,1,2,3];
  if(n===3){
    openLane=openLane<0?(Math.random()*4|0):Math.max(0,Math.min(3,openLane+(Math.random()*3|0)-1));
    lanes=lanes.filter(l=>l!==openLane);
  }else openLane=-1;
  lanes.sort(()=>Math.random()-.5);
  let made=0;
  for(const l of lanes){
    if(made>=n)break;
    const cone=Math.random()<.2+.25*p,type=cone?'cone':'car';
    if(objs.some(o=>o.lane===l&&(o.type!==type||o.y<170)))continue;
    objs.push({type,lane:l,x:RL+LW*(l+.5),y:-80,tv:cone?0:LANE_SPEED[l],hw:cone?9:15,hh:cone?9:29,color:COLORS[Math.random()*COLORS.length|0],passed:false});
    made++;
  }
}

function update(dt){
  let dir=(keys.right-keys.left)||touch.dir;
  if(mode==='play'){
    const thr=keys.up||touch.on;
    if(keys.boost)speed=Math.min(MAXB,speed+220*dt);
    else{
      if(thr)speed+=120*(1.15-speed/MAX)*dt;
      else if(speed>100)speed-=22*dt;
      if(speed>MAX)speed=Math.max(MAX,speed-140*dt);
    }
    if(keys.down)speed-=190*dt;
    speed=Math.max(60,Math.min(MAXB,speed));
  }else if(mode==='over')speed=Math.max(0,speed-260*dt);
  else speed=120;
  pvx+=(dir*340-pvx)*Math.min(1,dt*9);
  if(mode==='play')px=Math.max(RL+20,Math.min(RR-20,px+pvx*dt));
  else pvx*=.9;
  const scroll=speed*K*dt;off+=scroll;
  if(mode!=='play'){return}
  time+=dt;dist+=speed/3.6*dt;acc+=scroll;
  const prog=Math.min(1,time/120);
  if(acc>=gap){acc=0;gap=(270+speed*.5+Math.random()*110)*(1-.4*prog);spawn()}
  invuln=Math.max(0,invuln-dt);
  for(const o of objs){
    o.y+=(speed-o.tv)*K*dt;
    if(o.dead)continue;
    if(invuln<=0&&Math.abs(o.x-px)<o.hw+11&&Math.abs(o.y-PY)<o.hh+27){
      o.dead=true;invuln=1.1;shake=.35;
      if(o.type==='car'){health-=25;speed*=.55}else{health-=10;speed*=.8}
      if(health<=0){health=0;end()}
    }
    if(o.type==='car'&&!o.passed&&o.y-o.hh>PY+29){
      o.passed=true;bonus+=50;pops.push({x:o.x,y:PY+10,t:1,text:'+50'});
    }
  }
  objs=objs.filter(o=>!o.dead&&o.y<H+90&&o.y>-400);
}

function car(x,y,color){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.roundRect(-14,-26,32,60,9);ctx.fill();
  ctx.fillStyle='#14161a';
  [[-18,-22],[13,-22],[-18,12],[13,12]].forEach(w=>{ctx.beginPath();ctx.roundRect(w[0],w[1],5,14,2);ctx.fill()});
  ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-16,-30,32,60,10);ctx.fill();
  ctx.fillStyle='rgba(12,16,24,.78)';
  ctx.beginPath();ctx.roundRect(-12,-15,24,12,3);ctx.fill();
  ctx.beginPath();ctx.roundRect(-11,11,22,8,3);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(-11,-2,22,12);
  ctx.fillStyle='#ffe9a8';ctx.fillRect(-12,-30,6,3);ctx.fillRect(6,-30,6,3);
  ctx.restore();
}
function cone(x,y){
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(x+2,y+3,11,0,7);ctx.fill();
  ctx.fillStyle='#f26a1b';ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();
  ctx.fillStyle='#f26a1b';ctx.beginPath();ctx.arc(x,y,3.5,0,7);ctx.fill();
}
function f1(x,y,tilt,alpha){
  ctx.save();ctx.translate(x,y);ctx.rotate(tilt);ctx.globalAlpha=alpha;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.roundRect(-12,-26,28,62,8);ctx.fill();
  ctx.fillStyle='#111317';
  [[-16,-27,7,13],[9,-27,7,13],[-17,11,9,17],[8,11,9,17]].forEach(w=>{ctx.beginPath();ctx.roundRect(w[0],w[1],w[2],w[3],2.5);ctx.fill()});
  ctx.fillRect(-9,-21,18,1.6);ctx.fillRect(-9,19,18,1.6);
  ctx.fillStyle='#e2231a';
  ctx.beginPath();ctx.roundRect(-16,-33,32,5,2);ctx.fill();
  ctx.beginPath();ctx.moveTo(-3,-30);ctx.lineTo(3,-30);ctx.lineTo(5.5,-10);ctx.lineTo(8,2);ctx.lineTo(7,20);ctx.lineTo(-7,20);ctx.lineTo(-8,2);ctx.lineTo(-5.5,-10);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.roundRect(-11,-2,22,18,5);ctx.fill();
  ctx.fillStyle='#f4f4f1';ctx.fillRect(-1,-28,2,18);
  ctx.fillStyle='#16181c';ctx.beginPath();ctx.roundRect(-15,26,30,6,2);ctx.fill();
  ctx.fillStyle='#e2231a';ctx.fillRect(-15,25,3,8);ctx.fillRect(12,25,3,8);
  ctx.fillStyle='#16181c';ctx.beginPath();ctx.arc(0,3,5.2,0,7);ctx.fill();
  ctx.fillStyle='#f4f4f1';ctx.beginPath();ctx.arc(0,3,3.6,0,7);ctx.fill();
  ctx.restore();
}

function draw(dt){
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake*16,(Math.random()-.5)*shake*16);shake-=dt*1.6}
  ctx.fillStyle='#c5d3bf';ctx.fillRect(-20,-20,W+40,H+40);
  const band=140,bo=off%(band*2);
  ctx.fillStyle='#bccab6';
  for(let y=-band*2+bo;y<H;y+=band*2){ctx.fillRect(-20,y,RL+20,band);ctx.fillRect(RR,y,W-RR+20,band)}
  ctx.fillStyle='#2e3238';ctx.fillRect(RL,-20,RR-RL,H+40);
  const k=30,ko=off%(k*2);
  for(let y=-k*2+ko;y<H;y+=k*2){
    ctx.fillStyle='#e2231a';ctx.fillRect(RL-10,y,10,k);ctx.fillRect(RR,y,10,k);
    ctx.fillStyle='#f4f4f1';ctx.fillRect(RL-10,y+k,10,k);ctx.fillRect(RR,y+k,10,k);
  }
  ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.32)';ctx.setLineDash([34,34]);ctx.lineDashOffset=-off;
  for(let i=1;i<LANES;i++){ctx.beginPath();ctx.moveTo(RL+LW*i,-40);ctx.lineTo(RL+LW*i,H+40);ctx.stroke()}
  ctx.setLineDash([]);ctx.strokeStyle='rgba(255,255,255,.7)';
  [RL+5,RR-5].forEach(x=>{ctx.beginPath();ctx.moveTo(x,-20);ctx.lineTo(x,H+20);ctx.stroke()});
  for(const o of objs){o.type==='cone'?cone(o.x,o.y):car(o.x,o.y,o.color)}
  if(mode!=='over'||health>0){
    const blink=invuln>0?(Math.sin(invuln*40)>0?.35:1):1;
    f1(px,PY,pvx/300*.14,blink);
  }
  ctx.font='700 22px "Barlow Condensed",Arial,sans-serif';ctx.textAlign='center';
  for(const p of pops){
    p.y-=46*dt;p.t-=dt*1.1;
    ctx.globalAlpha=Math.max(0,p.t);ctx.fillStyle='#ffd45e';ctx.fillText(p.text,p.x,p.y);
  }
  ctx.globalAlpha=1;pops=pops.filter(p=>p.t>0);
  ctx.restore();
}

function hud(){
  hpn.textContent=Math.round(health);hpf.style.width=health+'%';hpf.style.background='hsl('+(health*1.15)+' 62% 52%)';
  sc.textContent=score().toLocaleString();
  sp.textContent=Math.round(speed);sbf.style.width=(speed/MAXB*100)+'%';sbf.classList.toggle('boost',!!keys.boost&&mode==='play');
}

function frame(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  update(dt);draw(dt);hud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
